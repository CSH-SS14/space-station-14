      sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
      state: icon
    - type: Item
      sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
    - type: Storage
      grid:
      - 0,0,9,5 # TODO: Change this
      maxItemSize: Huge

